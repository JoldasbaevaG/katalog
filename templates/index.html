<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kolbasa Distribyutsiya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: yuqorida yopishqoq sarlavha, pastda keng kontent; savat va buyurtma sahifalarida chapda ro'yxat, o'ngda yopishqoq xulosa. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface-2:#F5F7F6; --ink:#14201A; --muted:#58675F; --line:#DAE1DD;
  --accent:#0D5C46; --accent-ink:#FFFFFF; --accent-soft:#DBEBE4;
  --opt:#85500A; --opt-soft:#FAEACB;
  --ok:#17703F; --ok-soft:#D8F0E1; --bad:#A92A1F; --bad-soft:#F8DEDA; --info:#1B56B8; --info-soft:#DDE8F8; --warn:#85500A; --warn-soft:#FAEACB;
  --tile-s:34%; --tile-l:90%; --tile-ink:26%;
  --shadow:0 1px 2px rgba(20,32,26,.06),0 8px 24px rgba(20,32,26,.07);
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#161F1B; --surface-2:#1C2722; --ink:#E7EEEA; --muted:#97A99F; --line:#273530;
    --accent:#4DBE98; --accent-ink:#062319; --accent-soft:#1B3A30;
    --opt:#EDB75E; --opt-soft:#3A2B10;
    --ok:#5ED08F; --ok-soft:#173A27; --bad:#FF8A7D; --bad-soft:#44201C; --info:#8DB5FF; --info-soft:#1B2B4A; --warn:#EDB75E; --warn-soft:#3A2B10;
    --tile-s:26%; --tile-l:24%; --tile-ink:80%;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#161F1B; --surface-2:#1C2722; --ink:#E7EEEA; --muted:#97A99F; --line:#273530;
  --accent:#4DBE98; --accent-ink:#062319; --accent-soft:#1B3A30;
  --opt:#EDB75E; --opt-soft:#3A2B10;
  --ok:#5ED08F; --ok-soft:#173A27; --bad:#FF8A7D; --bad-soft:#44201C; --info:#8DB5FF; --info-soft:#1B2B4A; --warn:#EDB75E; --warn-soft:#3A2B10;
  --tile-s:26%; --tile-l:24%; --tile-ink:80%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(24px,4.2vw,34px);font-weight:700}
h2{font-size:21px;font-weight:650}
h3{font-size:17px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.fine{font-size:13px;color:var(--muted)}
.sub{color:var(--muted);margin-top:6px;max-width:60ch}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Sarlavha */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em;background:none;border:0;padding:0;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:4px;order:3;width:100%;overflow-x:auto;scrollbar-width:none}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:550;white-space:nowrap}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.hdr-r{margin-left:auto;display:flex;gap:8px;align-items:center;min-width:0}
@media(min-width:820px){.nav{order:0;width:auto}}
.acct{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 6px;border:1px solid var(--line);border-radius:99px;background:var(--surface);max-width:220px}
.acct .av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.acct-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550;font-size:14px}
@media(max-width:520px){.acct-n{display:none}.acct{padding:0 6px}}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent-ink);color:var(--accent);font-size:12px;font-weight:700}
.cart-sum{font-variant-numeric:tabular-nums}
@media(max-width:520px){.cart-sum{display:none}}

/* Tugmalar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:550;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--surface-2)}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-p:hover{background:var(--accent);filter:brightness(1.1)}
.btn-opt{background:var(--opt-soft);border-color:transparent;color:var(--opt)}
.btn-opt:hover{background:var(--opt-soft);filter:brightness(.97)}
.btn-lg{min-height:48px;font-size:16px;padding:0 20px}
.btn-sm{min-height:34px;padding:0 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:550;text-decoration:underline;text-underline-offset:3px}
.x{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;flex:none;color:var(--muted)}
.x:hover{background:var(--surface-2)}

main{padding-block:24px 56px;display:flex;flex-direction:column;gap:20px}
.page-h{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.search{flex:1 1 260px;max-width:380px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.note{background:var(--info-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:14px;align-items:center}
.crumb{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}

/* Firmalar */
.grid-f{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:600px){
  .grid-f{gap:8px}
  .ftile{padding:12px 8px;align-items:center;text-align:center;gap:8px}
  .ftile .mtile{width:44px!important;height:44px!important;font-size:18px!important}
  .ftile b{font-size:14px;overflow-wrap:anywhere}
  .ftile .meta{font-size:12px}
  .ftile .cats{display:none}
}
.btn-del{color:var(--bad)}
.addbox{padding:18px;display:flex;flex-direction:column;gap:14px}
.ftile{padding:18px;display:flex;flex-direction:column;gap:16px;text-align:left;transition:box-shadow .15s,transform .15s;min-width:0}
.ftile:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.ftile b{font-size:19px;letter-spacing:-.01em}
.ftile .meta{color:var(--muted);font-size:14px}
.ftile .cats{display:flex;flex-wrap:wrap;gap:6px}
.mtile{border-radius:12px;background:hsl(var(--h) var(--tile-s) var(--tile-l));color:hsl(var(--h) 45% var(--tile-ink));display:grid;place-items:center;font-weight:700;flex:none;letter-spacing:-.02em}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.firm-h{display:flex;align-items:center;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:550;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.chip span{color:var(--muted);font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on span{color:inherit;opacity:.8}

/* Mahsulotlar */
.grid-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcard{padding:16px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s;min-width:0;cursor:pointer}
.pcard:hover{box-shadow:var(--shadow)}
.pc-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pcard h3{overflow-wrap:anywhere}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prices>div{padding:10px;border-radius:9px;background:var(--surface-2);display:flex;flex-direction:column;gap:1px;min-width:0}
.prices .opt{background:var(--opt-soft)}
.prices .lbl{font-size:12px;color:var(--muted)}
.prices .opt .lbl{color:var(--opt)}
.prices b{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.prices small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pc-act{display:flex;gap:8px;margin-top:2px}
.pc-act .btn{flex:1;min-width:0}
.out{color:var(--bad);font-weight:600;padding:8px 0}

/* Oyna */
.ov{position:fixed;inset:0;background:rgba(8,16,12,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.md{background:var(--surface);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media(min-width:640px){.ov{align-items:center;padding:20px}.md{border-radius:16px;box-shadow:var(--shadow)}}
.md-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.md-t{display:flex;gap:12px;align-items:center;min-width:0}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.spec>div{padding:10px 12px;background:var(--surface-2);border-radius:9px;min-width:0}
.spec dt{font-size:12px;color:var(--muted)}
.spec dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.spec dd small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.buy{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.buy-f{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--line)}
.big{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:550;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.qty button{width:38px;height:38px;background:var(--surface);border:0;font-size:18px}
.qty button:hover{background:var(--surface-2)}
.qty input{width:56px;text-align:center;border:0;border-inline:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button,.qty input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* Savat */
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.line{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px 16px;align-items:center}
.line .ln-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.ln-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ln-sum{text-align:right;display:flex;flex-direction:column;min-width:110px;font-variant-numeric:tabular-nums}
@media(max-width:720px){.line{grid-template-columns:minmax(0,1fr) auto}.ln-ctl{grid-column:1/-1}.ln-sum{text-align:left;flex-direction:row;gap:10px;align-items:baseline;grid-column:1/2}}
.sumbox{padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}
@media(max-width:900px){.sumbox{position:static}}
.sumbox dl{margin:0;display:flex;flex-direction:column;gap:6px}
.sumbox dl div{display:flex;justify-content:space-between;gap:12px}
.sumbox dt{color:var(--muted)}
.sumbox dd{margin:0;font-variant-numeric:tabular-nums;font-weight:550}
.sumbox .tot{padding-top:12px;border-top:1px solid var(--line);align-items:baseline}
.sumbox .tot dd{font-size:22px;font-weight:700}

/* Formalar */
.form{padding:20px;display:flex;flex-direction:column;gap:18px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:640px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field>label,.lab{font-weight:600;font-size:14px}
.in{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
textarea.in{padding:10px 12px;min-height:84px;resize:vertical}
.in.sm{min-height:36px;max-width:150px;text-align:right;font-variant-numeric:tabular-nums}
.in.bad{border-color:var(--bad)}
.err{color:var(--bad);font-size:13px}
.hint{color:var(--muted);font-size:13px}
.pays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:640px){.pays{grid-template-columns:minmax(0,1fr)}}
.payopt{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);align-items:flex-start;cursor:pointer}
.payopt.on{border-color:var(--accent);background:var(--accent-soft)}
.payopt input{margin-top:4px;accent-color:var(--accent)}
.payopt b{display:block}
.payopt span{font-size:13px;color:var(--muted)}
.h-sec{display:flex;flex-direction:column;gap:12px}
.mini{padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}

/* Buyurtmalar */
.st{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.st-new{background:var(--info-soft);color:var(--info)}
.st-ok{background:var(--warn-soft);color:var(--warn)}
.st-way{background:var(--accent-soft);color:var(--accent)}
.st-done{background:var(--ok-soft);color:var(--ok)}
.st-cancel{background:var(--bad-soft);color:var(--bad)}
.ord summary{list-style:none;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;cursor:pointer}
.ord summary::-webkit-details-marker{display:none}
.ord .o-body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.ord .o-body>*:first-child{margin-top:14px}
.o-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.o-info div{min-width:0;overflow-wrap:anywhere}
.o-info dt{font-size:12px;color:var(--muted)}
.o-info dd{margin:0}
.o-info{margin:0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:24px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.done{padding:32px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.done .ok{width:48px;height:48px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow);font-weight:550}
.toast.bad{background:var(--bad);color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+" so'm"}
function pad(n){return n<10?'0'+n:''+n}
function isoDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtD(iso){var a=String(iso||'').split('-');return a.length===3?a[2]+'.'+a[1]+'.'+a[0]:''}
function fmtT(ts){var d=new Date(ts);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function firmOf(k){return FM[k]}
function defBox(p){return p.cb||Math.round(p.box*p.p*0.95/1000)*1000}
function numOr(v,d){return typeof v==='number'&&isFinite(v)&&v>0?v:d}
function eff(p){var o=S.prices[p.id]||{};return {p:numOr(o.p,p.p),c:numOr(o.c,defBox(p)),off:!!o.off}}
function unit(pid,mode){var e=eff(PM[pid]);return mode==='k'?e.c:e.p}
function toInt(s){var d=String(s==null?'':s).replace(/\D/g,'');return d?parseInt(d,10):null}
function phoneDigits(s){var d=String(s||'').replace(/\D/g,'');if(d.indexOf('998')===0)d=d.slice(3);return d}
function phoneFmt(d){return '+998 '+d.slice(0,2)+' '+d.slice(2,5)+' '+d.slice(5,7)+' '+d.slice(7,9)}
function clamp(v){v=parseInt(v,10);if(!(v>=1))v=1;if(v>999)v=999;return v}
function payName(k){for(var i=0;i<PAY.length;i++)if(PAY[i][0]===k)return PAY[i][1];return k}

    case 'cart':return cartView();
    case 'checkout':return checkoutView();
    case 'register':return registerView();
    case 'orders':return myOrdersView();
    case 'admin':return adminView();
    case 'done':return doneView();
    default:return katalogView();
  }
}

/* ---------- Chizish ---------- */
function render(){
  var act=document.activeElement,fid=null,ss=null,se=null;
  if(act&&act.id&&app.contains(act)){fid=act.id;try{ss=act.selectionStart;se=act.selectionEnd}catch(e){}}
  app.innerHTML=hdr()+'<main class="wrap">'+modeBanner()+viewHtml()+'</main>';
  modalEl.innerHTML=modalHtml();
  document.body.style.overflow=S.modal?'hidden':'';
  if(fid){
    var el=document.getElementById(fid);
    if(el){el.focus();try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}
  }
}
function go(v){
  S.view=v;S.modal=null;S.errs={};
  if(v==='katalog'){S.firm=null;S.type='all'}
  if(v==='register'){S.reg=Object.assign({name:'',dir:'',stir:'',phone:'',addr:'',biz:BIZ[0]},S.client||{})}
  if(v==='checkout'&&S.client&&!S.co.addr)S.co.addr=S.client.addr||'';
  window.scrollTo(0,0);render();
}
function focusClose(){var b=document.querySelector('.modal-close');if(b)b.focus()}

/* ---------- Amallar ---------- */
function regSave(){
  var r=S.reg,er={};
  if((r.name||'').trim().length<2)er.name='Korxona nomini kiriting';
  if((r.dir||'').trim().length<3)er.dir='Rahbar F.I.O. ni kiriting';
  if(!/^\d{9}$/.test(String(r.stir||'').replace(/\D/g,'')))er.stir='STIR 9 ta raqamdan iborat';
  var ph=phoneDigits(r.phone);
  if(ph.length!==9)er.phone='Telefon raqamini to\'liq kiriting: +998 XX XXX XX XX';
  if((r.addr||'').trim().length<5)er.addr='Manzilni kiriting';
  S.errs=er;
  if(Object.keys(er).length){render();return}
  var c={name:r.name.trim(),dir:r.dir.trim(),stir:String(r.stir).replace(/\D/g,''),phone:phoneFmt(ph),addr:r.addr.trim(),biz:r.biz||BIZ[0],at:(S.client&&S.client.at)||Date.now()};
  saveClient(c).then(function(){
    toast('Ma\'lumotlar saqlandi');
    var nx=S.afterReg||'katalog';S.afterReg='katalog';go(nx);
  }).catch(function(e){toast(errMsg(e),1)});
}
function submitOrder(){
  var co=S.co,er={},today=isoDate(new Date());
  if((co.addr||'').trim().length<5)er.addr='Yetkazish manzilini kiriting';
  if(!co.date||co.date<today)er.date='Bugundan oldingi sanani tanlab bo\'lmaydi';
  S.errs=er;
  if(Object.keys(er).length){render();return}
  var c=cartCalc();if(!c.kinds||c.hasOff)return;
  var now=Date.now(),d=new Date(now);
  var o={
    id:'o'+now.toString(36)+Math.random().toString(36).slice(2,5),
    no:'B-'+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+'-'+Math.random().toString(36).slice(2,6).toUpperCase(),
    at:now,
    client:{name:S.client.name,dir:S.client.dir,stir:S.client.stir,phone:S.client.phone},
    addr:co.addr.trim(),date:co.date,slot:co.slot,pay:co.pay,comment:(co.comment||'').trim(),
    lines:S.cart.map(function(l){var p=PM[l.pid];return {pid:l.pid,name:p.name,firm:firmOf(p.firm).n,mode:l.mode,qty:l.qty,box:p.box,price:unit(l.pid,l.mode)}}),
    total:c.total
  };
  S.sending=true;render();
  sendOrder(o).then(function(){
    S.sending=false;S.cart=[];saveCart();S.placed=o;S.co.comment='';go('done');
  }).catch(function(e){S.sending=false;toast(errMsg(e),1);render()});
}

async function hashPass(salt,pass){
  var s=salt+':'+pass;
  try{
    var d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.prototype.map.call(new Uint8Array(d),function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
  }catch(e){
    var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;
    return 'x'+(h>>>0).toString(16);
  }
}
async function admRegister(){
  var f=S.adm.form,er={};
  if((f.name||'').trim().length<2)er.name='Kompaniya nomini kiriting';
  if((f.fio||'').trim().length<3)er.fio='F.I.O. ni kiriting';
  var ph=phoneDigits(f.phone);
  if(ph.length!==9)er.phone='Telefon raqamini to\'liq kiriting: +998 XX XXX XX XX';
  if((f.login||'').trim().length<4)er.login='Login kamida 4 belgi bo\'lsin';
  if((f.pass||'').length<6)er.pass='Parol kamida 6 belgi bo\'lsin';
  else if(f.pass!==f.pass2)er.pass2='Parollar bir xil emas';
  S.errs=er;
  if(Object.keys(er).length){render();return}
  var salt=Math.random().toString(36).slice(2,10);
  var prof={name:f.name.trim(),fio:f.fio.trim(),phone:phoneFmt(ph),login:f.login.trim().toLowerCase(),salt:salt,hash:await hashPass(salt,f.pass),at:Date.now()};
  try{
    if(S.mode==='cloud')await S.db.doc('admin/profile').set(prof);else LS.set('kd_admin',prof);
    S.adm.profile=prof;S.adm.authed=true;S.adm.form={name:'',fio:'',phone:'',login:'',pass:'',pass2:''};S.errs={};
    toast('Admin ro\'yxatdan o\'tdi');render();
  }catch(e){toast(errMsg(e),1)}
}
async function admLogin(){
  var l=S.adm.login,p=S.adm.profile;
  var h=await hashPass(p.salt,l.pass||'');
  if((l.login||'').trim().toLowerCase()===p.login&&h===p.hash){
    S.adm.authed=true;S.adm.login={login:'',pass:''};S.errs={};render();
  }else{S.errs={login:'Login yoki parol noto\'g\'ri'};render()}
}
function applyCatalog(cat){
  S.cat={custom:(cat&&cat.custom)||[],removed:(cat&&cat.removed)||[]};
  rebuild(S.cat);
  var n=S.cart.length;
  S.cart=S.cart.filter(function(l){return PM[l.pid]});
  if(S.cart.length!==n)saveCart();
  if(S.modal&&!PM[S.modal.id])S.modal=null;
}
async function saveCatalog(cat){
  try{
    if(S.mode==='cloud')await S.db.doc('settings/catalog').set(cat);else LS.set('kd_catalog',cat);
    applyCatalog(cat);render();return true;
  }catch(e){toast(errMsg(e),1);return false}
}
async function addProduct(){
  var n=S.np,er={};
  if((n.name||'').trim().length<2)er.name='Tovar nomini kiriting';
  var g=toInt(n.g),box=toInt(n.box),p=toInt(n.p),c=toInt(n.c);
  if(!g)er.g='Massani gramm hisobida kiriting';
  if(!box)er.box='Korobkadagi donalar sonini kiriting';
  if(!p)er.p='Dona narxini kiriting';
  S.errs=er;
  if(Object.keys(er).length){render();return}
  var prod={id:'x'+Date.now().toString(36),firm:n.firm,type:n.type,name:n.name.trim(),g:g,box:box,p:p,comp:((n.comp||'').trim().replace(/\.+$/,''))||'Tarkibi kiritilmagan'};
  if(c)prod.cb=c;
  var ok=await saveCatalog({custom:S.cat.custom.concat([prod]),removed:S.cat.removed});
  if(ok){toast('Tovar qo\'shildi');S.np=Object.assign({},S.np,{name:'',g:'',box:'',p:'',c:'',comp:''});S.addOpen=false;S.errs={};render()}
}
async function removeProduct(id){
  var isCustom=S.cat.custom.some(function(x){return x.id===id});
  var cat=isCustom
    ?{custom:S.cat.custom.filter(function(x){return x.id!==id}),removed:S.cat.removed}
    :{custom:S.cat.custom,removed:S.cat.removed.concat([id])};
  S.delId=null;delete S.draft[id];
  if(await saveCatalog(cat))toast('Tovar o\'chirildi');
}
async function restoreProduct(id){
  var ok=await saveCatalog({custom:S.cat.custom,removed:S.cat.removed.filter(function(x){return x!==id})});
  if(ok)toast('Tovar qaytarildi');
}

document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,d=el.dataset;
  switch(a){
    case 'go':go(d.v);break;
    case 'regfrom':S.afterReg=d.v;go('register');break;
    case 'firm':S.firm=d.k;S.type='all';S.view='firm';window.scrollTo(0,0);render();break;
    case 'type':S.type=d.t;render();break;
    case 'open':S.modal={id:d.id,mode:'d',qty:1};render();focusClose();break;
    case 'close':S.modal=null;render();break;
    case 'closeov':if(e.target===el){S.modal=null;render()}break;
    case 'mmode':S.modal.mode=d.m;render();break;
    case 'mq':S.modal.qty=clamp(S.modal.qty+parseInt(d.d,10));render();break;
    case 'addm':addToCart(S.modal.id,S.modal.mode,S.modal.qty);S.modal=null;render();break;
    case 'add':addToCart(d.id,d.mode,1);render();break;
    case 'cmode':S.cart[+d.i].mode=d.m;saveCart();render();break;
    case 'cq':S.cart[+d.i].qty=clamp(S.cart[+d.i].qty+parseInt(d.d,10));saveCart();render();break;
    case 'crm':S.cart.splice(+d.i,1);saveCart();render();break;
    case 'tocheckout':go('checkout');break;
    case 'submit':submitOrder();break;
    case 'regsave':regSave();break;
    case 'demoadmin':S.demoAdmin=!S.demoAdmin;LS.set('kd_demoadmin',S.demoAdmin);if(!S.demoAdmin&&S.view==='admin')S.view='katalog';render();break;
    case 'atab':S.adminTab=d.t;S.errs={};S.delId=null;render();break;
    case 'admreg':admRegister();break;
    case 'admlogin':admLogin();break;
    case 'admout':S.adm.authed=false;S.errs={};render();break;
    case 'addtoggle':S.addOpen=!S.addOpen;S.errs={};render();break;
    case 'addprod':addProduct();break;
    case 'delask':S.delId=d.id;render();break;
    case 'delcancel':S.delId=null;render();break;
    case 'delconfirm':removeProduct(d.id);break;
    case 'restore':restoreProduct(d.id);break;
    case 'ofilter':S.ordFilter=d.t;render();break;
    case 'otoggle':e.preventDefault();S.open[d.id]=!S.open[d.id];render();break;
    case 'saveprices':savePrices();break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.bind&&e.target.dataset.bind.indexOf('adm.login')===0){e.preventDefault();admLogin();return}
  if(e.key==='Escape'&&S.modal){S.modal=null;render();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pcard')){
    e.preventDefault();S.modal={id:e.target.dataset.id,mode:'d',qty:1};render();focusClose();
  }
});
function setPath(path,val){
  var ks=path.split('.'),o=S;
  for(var i=0;i<ks.length-1;i++){o=o[ks[i]]||(o[ks[i]]={})}
  o[ks[ks.length-1]]=val;
}
function bindSet(t,val){
  var path=t.dataset.bind;
  if(path.indexOf('draft.')===0){
    var pid=path.split('.')[1];
    if(!S.draft[pid]){var e=eff(PM[pid]);S.draft[pid]={p:String(e.p),c:String(e.c),off:e.off}}
  }
  setPath(path,val);
}
document.addEventListener('input',function(e){
  var t=e.target;if(!t.dataset||!t.dataset.bind)return;
  if(t.type==='radio'||t.type==='checkbox'||t.tagName==='SELECT'||t.type==='date')return;
  bindSet(t,t.value);
  if(t.dataset.bind==='q'||t.dataset.bind.indexOf('draft.')===0)render();
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t.dataset)return;
  if(t.dataset.qty){
    var v=clamp(t.value);
    if(t.dataset.qty==='m')S.modal.qty=v;else{S.cart[+t.dataset.i].qty=v;saveCart()}
    render();return;
  }
  if(t.dataset.status){setStatus(t.dataset.status,t.value);return}
  if(!t.dataset.bind)return;
  if(t.type==='checkbox')bindSet(t,t.checked);else bindSet(t,t.value);
  render();
});

/* ---------- Ishga tushirish ---------- */
function startLocal(){
  S.mode='local';
  S.client=LS.get('kd_client',null);S.myOrders=LS.get('kd_orders',[]);
  S.statuses=LS.get('kd_status',{});S.prices=LS.get('kd_prices',{});
  S.demoAdmin=LS.get('kd_demoadmin',false);S.cliLoaded=true;
  S.adm.profile=LS.get('kd_admin',null);S.adm.loaded=true;
  applyCatalog(LS.get('kd_catalog',{}));
}
function startCloud(db,uid,isAdmin){
  S.mode='cloud';S.db=db;S.uid=uid;S.isAdmin=isAdmin;
  var bad=function(){};
  db.doc('settings/catalog').onSnapshot(function(s){applyCatalog(s.exists?s.data():{});render()},bad);
  if(isAdmin)db.doc('admin/profile').onSnapshot(function(s){S.adm.profile=s.exists?s.data():null;S.adm.loaded=true;render()},function(){S.adm.loaded=true;render()});
  db.doc('settings/prices').onSnapshot(function(s){S.prices=(s.exists&&s.data().map)||{};render()},bad);
  db.doc('clients/'+uid).onSnapshot(function(s){S.client=s.exists?s.data():null;S.cliLoaded=true;render()},function(){S.cliLoaded=true;render()});
  db.doc('orders/'+uid).onSnapshot(function(s){S.myOrders=(s.exists&&s.data().list)||[];render()},bad);
  db.collection('orderStatus').onSnapshot(function(q){var m={};q.docs.forEach(function(d){m[d.id]=d.data()});S.statuses=m;render()},bad);
  if(isAdmin){
    db.collection('clients').onSnapshot(function(q){S.allClients=q.docs.map(function(d){return Object.assign({id:d.id},d.data())});render()},bad);
    db.collection('orders').onSnapshot(function(q){
      var all=[];q.docs.forEach(function(d){((d.data().list)||[]).forEach(function(o){all.push(Object.assign({cid:d.id},o))})});
      S.allOrders=all;render();
    },bad);
  }
}
async function init(){
  render();
  var db=null,user=null;
  try{
    if(window.claude&&window.claude.use){
      var r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      db=r[0];user=r[1];
    }
  }catch(e){}
  var uid=null;
  if(db&&user){try{uid=await user.id()}catch(e){}}
  if(db&&user&&uid){
    var adm=false;
    try{adm=await user.canEdit()}catch(e){}
    try{var cw=await user.can('data.write');S.canWrite=(cw!==false)||adm}catch(e){}
    startCloud(db,uid,adm);
  }else startLocal();
  render();
}
init();
})();
